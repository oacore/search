  reason: "T-008 c3 (R-027, CS-N12-4), CS-N12-5. next 12.3.7 declares its 13 @next/swc-* binaries at 12.3.4 in dependencies and optionalDependencies (the releases 12.3.5..12.3.7 of 2025-03 published no new binaries; npm view next@12.3.7 optionalDependencies), so the lock holds them at 12.3.4, exactly what next requires: all 13 in packages and in dependencies (lockfileVersion 2), gnu and musl of both linux arches, and Next's own lockfile check finds nothing missing (no 'patching' line in the build log). The rule compares each linux binary with next's own version, which 10.2.3 (none) and 12.1.6 (all 12.1.6) met. The rest of the clause: rule.next = the lock's next (12.3.7) and the installed tree holds its platform binary (@next/swc-darwin-arm64 12.3.4). Alternative (an acceptance change, 40 §8 rule 8, owner): compare each binary with the version next declares for it in optionalDependencies, which is what the clause title says; then this row is not needed. The same rule runs in test/static/lib/P0-16/install-checks.js verifyTree (bash test/ops/t008.sh --tree, the host form of the alpine container check), whose `ok` requires `native.violations.length === 0` (it has no accepted list): applied there by a new list `C3_ACCEPTED` of these four exact lines above verifyTree, under a comment that names this AD id (two lines, within max-len 80: the file is a harness file under T-001 c2), filtered out only in verifyTree's `ok` (`native.violations.filter((x) => !C3_ACCEPTED.includes(x)).length === 0`), with nativeRule unchanged, so the report's c3 and the Jest clause still see the four lines (the dry-run clone: t008 --tree ok with c3 listing the four lines, T-008 and T-001 green)."
