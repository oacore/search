  to: "126 sent, 47 completed before SIGTERM (200), the 31 in flight at SIGTERM all answered 200 (the last 1507 ms after the signal), 28 started between SIGTERM and exit answered 502 by the proxy in 1 to 109 ms, 0 in flight at exit, 20 after exit (502); exit 1525 ms after SIGTERM (code 0, inside the grace budget): the run on the W6d tip build dc2679906131eb8a whose soft copy recorded the classes; the unmodified run on that build gave 125 sent, 47 before, 0 in flight at exit, 19 after exit, exit 1538 ms (it records no split between in flight and started during)"
  reason: "T-901 c7 (VF-21, OD-19, P0-16-3): Next 14.2.35's `next start` answers SIGTERM with `server.close(() => process.exit(0))` (node_modules/next/dist/server/lib/start-server.js:223-240; 13.5.11: `server.close(); process.exit(0)` at once, :206-218, and bin/next's own SIGTERM exit, gone in 14.2), so it stops accepting connections, lets every request it is serving finish, then exits. The test pinned today's cut (Next 10.2.3's, issue P0-16-3, kept by 12.3.7 and 13.5; 41 says the requests complete, from the first Next that drains): on 14.2 none is cut, so its assertion at :483 is red (read again on the W6d tip build dc2679906131eb8a: 0 cut where 5 or more were expected; exit code 0, every request before the signal 200, every request after the exit 502). With decision W6D-M (a) of the jump 3 batch W6d rows the test takes the drain: no request is in flight at the exit, at least 5 were in flight at the signal, and each of them is answered 200 (the classes a soft copy recorded on the tip: 31 in flight at the signal, all 200, the last 1507 ms after it; on the bump's build 29, the last at 1487 ms); the requests that start between the signal and the exit are not asserted, as before. A local `next start` probe on the bump's build: with a client that has sent half a request at SIGTERM, 14.2.35 waits until it completes (200 at +3.0 s, exit 3019 ms after SIGTERM, a new connection meanwhile refused), 13.5.11 exits in 16 ms and cuts it; idle and keep-alive: both exit in 9-10 ms. Visitor effect during a rollout, expected from the sources and these host-mode probes, not measured under Kubernetes (decision W6D-H (a) of the jump 3 batch W6d: a deploy-time row): requests already being served by a stopping pod are answered instead of failing (502); a request that never ends keeps the pod up until the kill at terminationGracePeriodSeconds. The assertions at the site, the AD id beside them."
