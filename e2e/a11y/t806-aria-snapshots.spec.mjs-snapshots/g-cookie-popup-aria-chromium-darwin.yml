- banner:
  - link "CORE CORE CO nnecting RE positories":
    - /url: https://core.ac.uk/
    - img "CORE"
    - text: CORE CO nnecting RE positories
  - navigation:
    - button "Services"
    - button "Support us"
    - button "About"
- main:
  - heading "Article Takedown Request" [level=2]
  - img "takedown"
  - paragraph: To remove a paper from CORE, please search for the paper using the search box at the top of this page.
  - paragraph: When you have found the paper, please enter the URL of the paper from CORE into the form on the right and we will redirect you to the correct page.
  - paragraph: "Put link to the article here:"
  - textbox "CORE URL":
    - /placeholder: e.g. https://core.ac.uk/display/1
  - text: CORE URL
  - button "SUBMIT"
  - heading "Types of links you can use to fill up the CORE URL field" [level=4]
  - paragraph:
    - text: "For example, suppose you wanted to remove the paper:"
    - 'link "CORE: aggregation use cases for open access"':
      - /url: https://core.ac.uk/display/82976757?recSetID=
    - text: .
  - paragraph: "In the CORE URL box, you may enter one of the following:"
  - list:
    - listitem:
      - text: A outputs page URL
      - link "https://core.ac.uk/outputs/82976757":
        - /url: https://core.ac.uk/outputs/82976757
    - listitem:
      - text: A fulltext URL
      - link "https://core.ac.uk/download/82976757.pdf":
        - /url: "https://core.ac.uk/download/82976757.pdf "
  - paragraph:
    - text: Please note that the form does not accept links which start with "https://core.ac.uk/
    - strong: search
    - text: "\" and \"https://core.ac.uk/"
    - strong: works
    - text: "\"."
  - img "faq"
  - paragraph:
    - text: You can find out more information about deleting articles in the
    - link "\"Removing full text or metadata\"":
      - /url: https://core.ac.uk/faq
    - text: section of the FAQs.
