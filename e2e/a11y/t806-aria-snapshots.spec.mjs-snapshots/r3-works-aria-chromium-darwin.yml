  - figure:
    - link "Full text link":
      - /url: http://<stack>/reader/29255347
  - text: Recent increases in the scientific robustness of seasonal climate forecasts have not led to substantial changes in farmers’ risk management strategies of actors, largely because there is poor integration of scientific forecasting into farmers’ decision-making processes. The goal of the research presented here is to explore the potentials and constraints for farmers’ application of seasonal climate forecasts through an analysis of the cultural contexts of their decision-making and information use. Semi-structured interviews were conducted with 38 farmers in southern Georgia, examining their approaches, risk-management, to livelihood goals and strategies, and interactions with weather and climate information. Findings indicate that farmers’ management of risks associated with climate variability is embedded within a broad array of social factors, including subjective construction of social and personal identities, goals, and values. These cultural contexts affect the ways that farmers interpret and might apply seasonal climate forecasts to agricultural decisions. These findings indicate that, rather than simply acting as a technical information input, seasonal climate forecasts and forecasters must gradually work theirway into farmers’ trusted social networks before their potential as risk management tools will be realized. Furthermore, while seeking to produce scientific information to support farmers’ adaptive practices, scientists themselves must adapt their own practices to better fit a coproduction of knowledge approach
