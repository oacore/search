  - text: This latest Climate Council report provides an update of climate change science, impacts and risks. This report draws from the massive body of evidence that human activities - primarily from the burning of coal, oil and gas - are driving dramatic changes in our climate system. The report outlines how the changing climate poses substantial and escalating risks for health, property, infrastructure, agriculture and natural ecosystems in Australia. Compared to our understanding when the last Critical Decade report was published, the risks of climate change for our well-being now look more serious at lower levels of climate change, strengthening the case for urgent action. Finally, the report describes why it is in Australia’s national interest to play a leadership role in the global move for strong climate action leading up to the Paris climate conference at the end of 2015
