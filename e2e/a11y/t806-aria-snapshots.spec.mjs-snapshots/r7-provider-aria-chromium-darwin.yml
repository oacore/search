  - text: •
  - definition: Geological Society of London
  - text: •
  - definition: "2027"
  - figure:
    - link "Full text link":
      - /url: http://<stack>/download/710737070.pdf
  - text: The petrography and geochemistry of Northwest Africa (NWA) 12593 reveals association with the ferroan anorthosite and magnesian suites, as well as highlands-type clasts that are compositionally distinct from Apollo highlands material, re-affirming previous observations of increased compositional diversity in lunar crustal rocks outside of the Apollo sampled region. A large number of apatite grains were identified in lunar meteorite NWA 12593, in texturally pristine condition and associated with lithic clasts and the impact melt matrix. Chlorine and hydrogen isotope compositions obtained on apatite in NWA 12593 (δ 37 Cl = + 11.3 ‰ to + 53.1 ‰; δD = − 368 ‰ to + 1030 ‰) are significantly greater than in Apollo samples and basaltic lunar meteorites, with a broad range of volatile abundances spanning two orders of magnitude (Cl = 1053-12337 ppm; H2O = 143-4486 ppm). These volatile signatures reveal new insights into the distribution and isotopic heterogeneity of highly volatile elements in areas of the lunar surface not sampled previously and indicate that the lunar interior may have been equally heterogenous throughout its evolution. The variety of impact melt and lithic material in this sample implies a complex impact history that can contribute to future lunar exploration (e.g., Artemis III) surface activity goals of determining the lunar record of Inner Solar System impact history and volatile distribution throughout the lunar surface and interior
  - heading "The Innocence You Have Fought For" [level=3]:
    - link "The Innocence You Have Fought For":
      - /url: http://<stack>/outputs/753685736
  - definition:
    - list "Author":
      - listitem:
        - link "Chappell Sophie-Grace":
          - /url: /search?q=author:(Chappell, Sophie-Grace)
  - text: •
  - definition: Routledge
  - text: •
  - definition: 01/01/2027
  - figure: No full text
  - text: To learn is to come to know; to learn morally is to come to have moral knowledge. Few philosophers doubt the general possibility of learning, but it is controversial whether there is even such a thing as moral learning or moral knowledge. Among those (such as me) who affirm that there is such a thing, my thesis in this chapter must seem even more controversial. It is that innocence is a good thing; that there is a kind of innocence that can be learned, and indeed taught; and that learning innocence is an essential part of moral learning. This sounds paradoxical because innocence seems close-allied with ignorance. Innocence seems to involve not so much knowledge as the absence of knowledge; not so much learning as not-learning, perhaps indeed un-learning; not moral progress, but its cessation or even reversal. Nonetheless, I say that innocence – whether or not we should actually count it as a virtue – is an attribute of character that often deserves our admiration and emulation. And that innocence is a rather neglected thick ethical concept (perhaps in fact two concepts) that is worth retrieving, because it is often among the right concepts to deploy when we are trying to articulate what exactly is good in some case of excellence in action. For there are things that it is good not to know; there are habits of mind that it is better not to learn, or even to un-learn; and there are thoughts that it is the mark of virtue not to have. So I offer up my ‘Innocence’, and hope not to get repaid in scorn
  - heading "The Routledge Companion to Global Art Histories" [level=3]:
    - link "The Routledge Companion to Global Art Histories":
      - /url: http://<stack>/outputs/750693368
  - definition:
    - list "Author"
  - text: •
  - definition: Routledge (In Press)
  - text: •
  - definition: 10/02/2027
  - figure: No full text
  - text: "The Routledge Companion to Global Art Histories explores contemporary global art histories, theories and practices through diverse local, national and transnational perspectives which challenge traditional narratives and embrace cultural plurality.This Companion features twenty original essays from leading international scholars, organised into four thematic sections: methodologies and pedagogies, identity and agency, place and ecologies, memory and geopolitics. Each section includes an introduction to guide readers through key concepts. The book provides practical frameworks for understanding how power, location and cultural difference shape art histories, enhanced with case studies from the Caribbean, India, China, the Netherlands, the Middle East, Africa, Oceania and other regions, demonstrating how local perspectives reshape global art history narratives. This volume will be an indispensable reference for scholars and advanced students of art history, visual culture, museum studies and postcolonial studies. It is particularly useful for teachers developing decolonised curricula and scholars studying contemporary art, global modernisms, cultural geography and transnational art practices. Museum professionals, curators and practitioners engaged with questions of representation, identity and institutional critique will also find this Companion useful for understanding and implementing global perspectives within their work"
  - heading "Oxygen Isotopes of Anhydrous Minerals within Micrometeorites Show Connections to Volatile-Rich Parent Bodies" [level=3]:
    - link "Oxygen Isotopes of Anhydrous Minerals within Micrometeorites Show Connections to Volatile-Rich Parent Bodies":
      - /url: http://<stack>/outputs/750693466
  - definition:
    - list "Author":
      - listitem:
        - link "Sims R. C.":
          - /url: /search?q=author:(Sims, R. C.)
        - text: ","
      - listitem:
        - link "Bose M.":
          - /url: /search?q=author:(Bose, M.)
        - text: ","
      - listitem:
        - button "+5 more"
        - text: ","
  - text: •
  - definition: "2027"
  - figure: No full text
  - text: "Chondritic materials retain isotopic signatures of protoplanetary disk gas and provide insights into disk chemistry and evolution during planet formation. We present mineralogy and oxygen isotope compositions of Antarctic micrometeorites (MMs) from the 1994 Cap Prud'homme collection, analysed by electron probe micro-analysis and nanoscale secondary ion mass spectrometry. Mineralogical and isotopic data link CP94-050 MMs to the carbonaceous chondrites (CCs), representing water-rich asteroidal and cometary materials. Olivine and pyroxene grains exhibit O isotopes that overlap with silicate inclusions in ordinary and carbonaceous chondrites. A majority of the minerals have values consistent with Type I and Type II chondrules (Δ 17 O ≈ -5 ‰ to +5 ‰), with the lowest Δ 17 O value being -30.5 ‰ (Particle #60), which is consistent with formation in the earliest, 16 O-rich disk reservoir. Particle #60 has the strongest affinities to olivine in CR chondrites, while particle #22 with an 16 O-rich composition has no definitive link to known chondrite types. Together, these results show that MMs sample a mixture of mostly hydrated outer-disk materials and, less abundant, refractory inner-disk silicates. The MMs in CP94-050 preserve primitive isotopic reservoirs despite post-accretionary alteration and offer critical constraints on the oxygen isotope reservoirs in the protoplanetary disk"
