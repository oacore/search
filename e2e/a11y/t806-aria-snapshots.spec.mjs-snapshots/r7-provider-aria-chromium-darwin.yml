  - definition: 01/01/2027
  - figure: No full text
  - text: This co-authored introduction to the Routledge Companion to Global Art Histories argues that global art histories cannot be secured through wider geographical coverage alone. They depend upon the methods and infrastructures through which art historical knowledge is produced, authorised, taught and circulated. Drawing on the editors’ experience of publishing, research, pedagogy and curatorial practice, it reconstructs the project’s intellectual provenance while distinguishing the volume from a prescriptive programme and from any simple identification of the ‘global’ with the ‘decolonial’. The Introduction examines how pedagogy, archives, classification, markets, political authority, ecology, restitution and repatriation determine which histories become legible, and on what terms. A curatorial project in Malaysia provides a concrete test of these questions, showing how decolonial ambitions encounter uneven cultural infrastructures, differentiated histories and competing expectations of representation. Across these examples, the argument shifts attention from inclusion by addition to the conditions that make some histories visible while constraining or excluding others. The four sections organise this enquiry through knowledge production and pedagogy; identity, voice and agency; place, geography and ecology; and memory, trauma and geopolitics. Together, they treat hegemony as a broader problem of institutional and political power rather than presenting Eurocentrism as a single explanatory cause. The Coda then confronts the economic and political conditions affecting Art History in the twenty-first century. The Introduction thus establishes the volume as a collection of situated and sometimes divergent arguments, connected by close attention to how global art histories are made and sustaine
  - heading "Petrography, geochronology, and volatile inventory of lunar meteorite Northwest Africa 12593" [level=3]:
