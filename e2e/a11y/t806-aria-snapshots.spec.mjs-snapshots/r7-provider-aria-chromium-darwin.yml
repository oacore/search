  - text: •
  - definition: Routledge
  - text: •
  - definition: 01/01/2027
  - figure: No full text
  - text: Unprecedented expansion of early childhood education (ECE) in low- and middle-income countries requires trained practitioners to provide quality learning opportunities for children. However, in Sub-Saharan Africa, only 64% of practitioners have been trained to the minimum national standard and access to training is variable. This chapter presents a model for designing accessible professional development using collaborative research, based on the process of co-creating “Skills for Early Education and Development” (SEED), with ECE practitioners in South Africa and Kenya. Drawing on a mixed method, comparative study of 272 ECE practitioners in South Africa and Kenya, and collaborative stakeholder workshops, practitioners’ priority training needs, motivations, and access to training were established, leading to co-created, skills-focused training. This participatory approach encourages practitioner “buy in,” by responding to their needs and priorities, and co-creating contextual examples, and offers a sustainable way to develop key skills for high-quality ECE practice with limited resources
  - heading "Introduction to The Routledge Companion to Global Art Histories" [level=3]:
