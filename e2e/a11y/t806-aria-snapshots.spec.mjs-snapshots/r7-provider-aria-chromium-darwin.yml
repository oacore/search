  - text: •
  - definition: Bloomsbury Academic (In Press)
  - text: •
  - definition: 01/01/2027
  - figure: No full text
  - text: The methodologies of Digital Humanities (DH) are acquiring an ever greater relevance to the study of the history of reading, for example through the collation of historical reading experiences in databases. The UK Reading Experience Database (UK-RED; Eliot, 1996). is one of the longest-running Digital Humanities projects in the United Kingdom, having collected in 20 years about 40,000 curated testimonies of reading dated between 1450 and 1945. As a corpus, UK-RED provides opportunities for both macro- and micro-scale research, combining corpus approaches with close reading and comparison of individual testimonies of reading (Crone and Halsey, 2012). This chapter will investigate how corpus linguistics approaches can be applied to the analysis of Digital Humanities resources such as UK-RED. It will examine the project’s data as a corpus, searching for language patterns in accounts of experiences of reading and examining the reading testimonies across the five-century span of the project. The application of corpus methods allows the interrogation of reading practices on a scale impossible with human means alone. The interpretation and critique of the results of these analyses can in turn stimulate new questions and signal paths for further investigations, such as those of the recent READ-IT project on contemporary digital reading practices
  - 'heading "Picture This: A new sociocultural ‘layered listening framework’ that promotes participation through documentary photography, with young children whose families have migrated to the UK." [level=3]':
    - 'link "Picture This: A new sociocultural ‘layered listening framework’ that promotes participation through documentary photography, with young children whose families have migrated to the UK."':
      - /url: http://<stack>/outputs/701292755
  - definition:
    - list "Author":
      - listitem:
        - link "Horsley Karen":
          - /url: /search?q=author:(Horsley, Karen)
  - text: •
  - definition: Bloomsbury Publishing (In Press)
  - text: •
  - definition: 01/01/2027
  - figure: No full text
  - text: High quality, equitable early childhood education and care (ECEC) is significant for the participation of children whose families have migrated to the UK. The rich lived experiences, perspectives and funds of knowledge of newly arrived children are largely invisible and there is an increased risk of social exclusion as a consequence. Drawing upon the findings of a three-year study using child-led photography and photo story books to explore three- to four-year-old children’s funds of knowledge, this chapter offers an original theoretical and pedagogic ‘layered listening framework’ (LLF) that blurs sociocultural theory and visual theories for deep listening with young children. This novel conceptualisation, comprising intuitive and wise photography; ambiguity; photographing democratically and ‘elastic spaces’ suggests an expanded guide for understanding how children as ‘photographer-authors’ co-create diverse perspectives about their lived experiences as pedagogical possibilities. Further research into photography is recommended for researchers and practitioners to develop ‘elastic spaces’ of ongoing dialogue and alternative ways of seeing in culturally responsive ECEC and beyond. Such possibilities have the potential for challenging deficit perspectives of diversity by building democratic relationships of trust and reciprocity, with and for strong, resilient communities with hearts as well as minds
