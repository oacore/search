# Compose topology of the e2e tiers (42 §3, 40 §2.2-§2.3). Started per run by scripts/e2e-stack.mjs (docker
# mode): project p2-<run>, ports 127.0.0.1:E2E_PORT_BASE+0..5, a per-run override file for the app env and
# mounts. Images by digest; the app never reaches the internet (egress-denied network, catch-all resolver).
# Docker mode is DEFERRED in this run (owner: local mode only); the file is kept for CI (42 §10).
name: p2-${P2_RUN:-default}

x-labels: &labels
  org.search.p2.run: ${P2_RUN:-default}

# per-run subnet ${P2_NET}.0/24 (e2e-stack sets P2_NET=172.30.<slot>), so parallel runs never overlap
networks:
  internal:
    internal: true
    ipam:
      config:
        - subnet: ${P2_NET:?P2_NET}.0/24
  edge: {}

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE=<repo>@sha256:<digest> or an image ID}
    labels: *labels
    # BUILD_TARGET, NODE_ENV and APP_ENV come only from the image (42 §2)
    environment:
      API_KEY: test-key
      Internal_API: http://stub
      Internal_API_HOST: api.core.ac.uk
      NODE_EXTRA_CA_CERTS: /certs/ca.pem
      NODE_OPTIONS: --max-old-space-size=1024
      UV_THREADPOOL_SIZE: '32'
    mem_limit: 768m
    dns: [${P2_NET}.53]
    volumes:
      - ${P2_RUN_DIR:?run dir}:/certs:ro
    networks:
      internal:
        ipv4_address: ${P2_NET}.10
    # the app sits only on the internal network: tests reach the origin as http://app:8080 from the runner
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:8080/api/healthz/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 60
    depends_on:
      stub:
        condition: service_healthy
      dns:
        condition: service_started

  stub:
    # Node by digest (the node:18-alpine index digest of STATUS §1; DEFERRED in local mode)
    image: ${STUB_IMAGE:-node:18-alpine}
    labels: *labels
    working_dir: /repo
    command: ['node', 'test/ssr/stub.mjs', '--run-dir', '/run', '--http-port', '80', '--https-port', '443', '--control-port', '8090', '--host', '0.0.0.0', '--link-origin', 'http://proxy:8080']
    volumes:
      - ${P2_REPO:?repo}:/repo:ro
      - ${P2_RUN_DIR:?run dir}:/run
    networks:
      internal:
        ipv4_address: ${P2_NET}.20
      edge: {}
    ports:
      - 127.0.0.1:${P2_PORT_STUB_HTTP:?}:80
      - 127.0.0.1:${P2_PORT_STUB_HTTPS:?}:443
      - 127.0.0.1:${P2_PORT_STUB_CONTROL:?}:8090
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:8090/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 1s
      timeout: 2s
      retries: 30

  dns:
    # dnsmasq by digest: every name resolves to the stub; queries are logged (40 §2.2)
    image: ${DNS_IMAGE:?dnsmasq image by digest}
    labels: *labels
    command: ['--no-daemon', '--log-queries', '--log-facility=-', '--address=/#/${P2_NET}.20', '--address=/stub/${P2_NET}.20', '--address=/app/${P2_NET}.10']
    cap_add: [NET_ADMIN]
    networks:
      internal:
        ipv4_address: ${P2_NET}.53

  proxy:
    # nginx by digest; configuration generated by e2e/proxy/generate.mjs into the run directory (T-612)
    image: ${PROXY_IMAGE:?nginx image by digest}
    labels: *labels
    volumes:
      - ${P2_RUN_DIR:?run dir}/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      internal:
        ipv4_address: ${P2_NET}.30
      edge: {}
    ports:
      - 127.0.0.1:${P2_PORT_GATEWAY:?}:8080
      - 127.0.0.1:${P2_PORT_ALLOW:?}:8081
    depends_on:
      app:
        condition: service_healthy

  runner:
    # built per job from e2e/runner/Dockerfile (40 §5); never pushed
    build:
      context: ..
      dockerfile: e2e/runner/Dockerfile
    profiles: [test]
    labels: *labels
    ipc: host
    working_dir: /repo
    environment:
      P2_IN_RUNNER: '1'
      ARTIFACT_DIR: /artifacts
      E2E_RUN: ${P2_RUN:-default}
    volumes:
      - ${P2_REPO:?repo}:/repo
      - ${P2_RUN_DIR:?run dir}/..:/artifacts/runs
    networks:
      internal:
        ipv4_address: ${P2_NET}.40
