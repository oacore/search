apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-frontend-search
  namespace: core-frontend
  labels:
    app: core-frontend-search
spec:
  replicas: 4
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: core-frontend-search
  template:
    metadata:
      labels:
        app: core-frontend-search
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        agentpool: userpool
      # No hostAlias for api.core.ac.uk: server-side (SSR) API calls are routed
      # to the in-cluster API service via Internal_API (see env below), and
      # browser calls use the public host directly. So the pod never needs to
      # resolve api.core.ac.uk to a reachable origin.
      securityContext:
        sysctls:
          - name: net.ipv4.ip_local_port_range
            value: "1024 65535"
      volumes:
        - name: cf-origin-ca
          configMap:
            name: cf-origin-ca
      containers:
        - name: core-frontend-search
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1024"
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/cf/cf-origin-ca.pem
            - name: UV_THREADPOOL_SIZE
              value: "32"
            # Server-side (SSR) API calls go straight to the in-cluster API
            # service (same namespace), skipping Cloudflare and the gateway.
            # Internal_API_HOST is sent as the Host header so the backend routes
            # as if it were the public host. Browser calls are unaffected (these
            # vars are not exposed to the client bundle).
            - name: Internal_API
              value: http://core-frontend-api.core-frontend.svc.cluster.local
            - name: Internal_API_HOST
              value: api.core.ac.uk
          envFrom:
            - secretRef:
                name: core-frontend-search-secrets
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: cf-origin-ca
              mountPath: /etc/ssl/cf
              readOnly: true
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          startupProbe:
            httpGet:
              path: /api/healthz/
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/healthz/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthz/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              # Right-sized 2026-07-09 from live usage (~150m/pod at full public
              # traffic). The old 1200m request reserved 8x actual use and made
              # the CPU HPA target unreachable (utilization never left ~12%).
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1Gi
