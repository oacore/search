# Baseline capture (42 §4, §6, §9; created at 2.4). Dispatch only. Modes:
#   golden      build the golden image from the golden tag (build-image.sh parity <G> B0, plus the nodsn and
#               harness variants), accept it (T-006, T-013, T-901, no token in `docker history`), capture the
#               record mode of T-6xx, T-7xx, T-8xx three times from fresh stacks, `diff -r c1 c2 && diff -r c1 c3`,
#               extract test/baseline/build/ from the image, and open the B0 link PR with the captures
#   recapture   tool re-capture of the chain-head reference (3 byte-identical captures), link PR
#   rebaseline  product re-baseline (D15): parity images of `before` and `after`, 3 captures each
# scripts/baseline-capture.sh runs the same steps on a workstation (local mode: host builds and stacks).
# The golden image is never pushed or deployed (OD-46); the link PR is merged only after the owner signs it.
name: Baseline capture

on:
  workflow_dispatch:
    inputs:
      mode:
        description: golden | recapture | rebaseline
        required: true
        type: choice
        options: [golden, recapture, rebaseline]
      ref:
        description: golden and recapture - the reference (the golden tag or the chain-head reference)
        required: false
        default: upgrade-golden
      before:
        description: rebaseline - the main head before the product change
        required: false
      after:
        description: rebaseline - the product PR merge ref (refs/pull/<n>/merge)
        required: false
      link:
        description: the chain link the captures become (B0, B1, ...)
        required: true
        default: B0

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: baseline-capture
  cancel-in-progress: false

env:
  ARTIFACT_DIR: ${{ github.workspace }}/../artifacts
  NEXT_TELEMETRY_DISABLED: '1'
  E2E_MODE: docker
  P2_DOCKER_MODE: enabled

jobs:
  capture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@oacore'
      - run: npm ci --include=dev --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm ci --no-audit --no-fund
        working-directory: e2e
      - name: Resolve the references
        id: refs
        run: |
          set -euo pipefail
          case "${{ inputs.mode }}" in
            golden|recapture) echo "ref=$(git rev-parse '${{ inputs.ref }}^{commit}')" >> "$GITHUB_OUTPUT" ;;
            rebaseline)
              git fetch origin "${{ inputs.after }}:refs/remotes/rebaseline/after"
              echo "before=$(git rev-parse '${{ inputs.before }}^{commit}')" >> "$GITHUB_OUTPUT"
              echo "after=$(git rev-parse refs/remotes/rebaseline/after)" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Golden image (42 §4)
        if: inputs.mode == 'golden'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          G='${{ steps.refs.outputs.ref }}'
          bash scripts/build-image.sh parity "$G" search-golden:${{ inputs.link }}
          bash scripts/build-image.sh parity "$G" search-golden:${{ inputs.link }}-nodsn --variant nodsn
          bash scripts/build-image.sh harness "$G" search-golden:${{ inputs.link }}-harness
          # images.json records of the three images, so that the stacks of the captures find them by ref
          node scripts/build-parity.mjs --mode docker --ref "$G"
          node scripts/build-parity.mjs --mode docker --ref "$G" --variant nodsn
          node scripts/build-parity.mjs --mode docker --ref "$G" --variant harness
          docker image inspect --format '{{.Id}} {{.Size}}' search-golden:${{ inputs.link }} | tee "$ARTIFACT_DIR/golden-image.txt"
      - name: Accept the golden image (T-006, T-013, T-901, no token in docker history)
        if: inputs.mode == 'golden'
        run: |
          set -euo pipefail
          img=search-golden:${{ inputs.link }}
          bash scripts/extract-next.sh "$img" "$ARTIFACT_DIR/golden-image"
          NEXT_DIR="$ARTIFACT_DIR/golden-image/.next" APP_ROOT="$ARTIFACT_DIR/golden-image" \
            npx jest --selectProjects static --runTestsByPath test/static/t006-design-config.test.js
          docker run --rm --entrypoint sh "$img" -c 'cd /app && npm ls --omit=dev --all --json' > "$ARTIFACT_DIR/golden-npm-ls.json" || true
          node -e '
            const a = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))
            const b = JSON.parse(require("fs").readFileSync(process.argv[2], "utf8"))
            const strip = (o) => JSON.stringify(o, (k, v) => (k === "overridden" ? undefined : v))
            if (strip(a) !== strip(b)) { console.error("T-013: image npm ls differs from the <base> record"); process.exit(1) }
          ' "$ARTIFACT_DIR/golden-npm-ls.json" test/baseline/base-npm-ls-omit-dev.json
          if docker history --no-trunc "$img" | grep -E '_authToken|npm_token=|NPM_TOKEN=[^ ]'; then
            echo "token in docker history"; exit 1
          fi
          bash test/ops/t901.sh "$img" --ref '${{ steps.refs.outputs.ref }}'
      - name: Capture 3x and diff (42 §6 items 1-2)
        run: |
          set -euo pipefail
          case "${{ inputs.mode }}" in
            golden) bash scripts/baseline-capture.sh golden --ref '${{ steps.refs.outputs.ref }}' --steps capture ;;
            recapture) bash scripts/baseline-capture.sh recapture --ref '${{ steps.refs.outputs.ref }}' --steps capture ;;
            rebaseline) bash scripts/baseline-capture.sh rebaseline --before '${{ steps.refs.outputs.before }}' --after '${{ steps.refs.outputs.after }}' --steps capture ;;
          esac
      - name: Build-derived baselines from the image (golden)
        if: inputs.mode == 'golden'
        run: node scripts/baseline-tools.mjs extract --build "$ARTIFACT_DIR/golden-image" --to test/baseline/build
      - name: Ledger files of the link
        run: |
          set -euo pipefail
          test -f test/baseline/ACCEPTED-DIFFS.yml || printf '# Accepted diffs ledger (42 §8): append-only, default deny.\n[]\n' > test/baseline/ACCEPTED-DIFFS.yml
          node scripts/baseline-tools.mjs env --build "$ARTIFACT_DIR/golden-image" --out test/baseline/env.json
          node scripts/baseline-tools.mjs manifest --link '${{ inputs.link }}' --kind '${{ inputs.mode }}' --provisional none
          sha256sum -c test/baseline/SHA256SUMS >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: baseline-capture-${{ inputs.mode }}
          path: |
            ${{ env.ARTIFACT_DIR }}/capture*
            ${{ env.ARTIFACT_DIR }}/golden*
          retention-days: 30
      - name: Open the link PR (the owner signs it, 42 §9)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="baseline/${{ inputs.link }}"
          git switch -c "$branch"
          git add test/baseline e2e
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -m "Record the ${{ inputs.link }} baselines (${{ inputs.mode }}, 42 §6)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "[2.5][${{ inputs.link }}] Baselines (${{ inputs.mode }})" \
            --body "Captures of ${{ steps.refs.outputs.ref || steps.refs.outputs.after }}: 3 byte-identical captures (run ${{ github.run_id }}). Owner signature required (42 §9)."
