# Gate S differential run (55 C4, GATE-x.6; created at 2.5). Dispatch only, at the gates and at the 55 §1 C4 steps.
#   default  A/B in one job on one runner: the chain-head reference (golden) and the candidate parity image, the C4
#            corpus replayed through the SSR stub (`npm run corpus`), every diff through the AD ledger, 3 clean
#            runs; refuses equal digests; the positive controls of test/faults/controls.json must each give >= 1
#            diff on their aspect (from 2.7)
#   live     the GATE-x.6 live A/B: release-recipe images of the reference and the candidate in the compose `live`
#            profile (egress to the API only, no stub), the real key as an Actions secret (VF-26), 2,000 URLs,
#            ref, cand, cand, ref per URL, paired bootstrap of the per-stratum latency ratio
# Written at 2.5, not live: the first run needs the owner (VF-26 key and quota, the real corpus, OD-35 draw seeds).
name: Gate S

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: the candidate commit (its parity image is built here)
        required: true
      golden:
        description: the chain-head reference
        required: false
        default: upgrade-golden
      corpus:
        description: the committed corpus under test/corpus/
        required: false
        default: c4
      N:
        description: URLs per run (the seeded per-stratum draw fixed at 2.5)
        required: false
        default: '500'
      live:
        description: run the GATE-x.6 live A/B instead
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: gate-s
  cancel-in-progress: false

env:
  ARTIFACT_DIR: ${{ github.workspace }}/../artifacts
  NEXT_TELEMETRY_DISABLED: '1'
  E2E_MODE: docker
  P2_DOCKER_MODE: enabled

jobs:
  differential:
    if: ${{ !inputs.live }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@oacore'
      - run: npm ci --include=dev --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Baselines and corpus intact (42 §7)
        run: sha256sum -c test/baseline/SHA256SUMS >/dev/null
      - name: Parity images of the reference and the candidate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          G="$(git rev-parse '${{ inputs.golden }}^{commit}')"
          C="$(git rev-parse '${{ inputs.candidate }}^{commit}')"
          echo "G=$G" >> "$GITHUB_ENV"; echo "C=$C" >> "$GITHUB_ENV"
          node scripts/build-parity.mjs --mode docker --ref "$G"
          node scripts/build-parity.mjs --mode docker --ref "$C"
      - name: C4 corpus A/B, 3 clean runs (refuses equal digests)
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            npm run corpus -- --corpus '${{ inputs.corpus }}' --golden "$G" --candidate "$C" --limit '${{ inputs.N }}' --id "gate-s-$GITHUB_RUN_ID-$i"
          done
      - name: Positive controls (55 C4; from 2.7)
        run: npm run corpus -- --controls --corpus '${{ inputs.corpus }}' --golden "$G"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate-s
          path: ${{ env.ARTIFACT_DIR }}/corpus/runs
          retention-days: 90

  live:
    if: ${{ inputs.live }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    environment: gate-live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@oacore'
      - run: npm ci --include=dev --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Release-recipe images of the reference and the gate commit (live data loader, real key)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          API_KEY: ${{ secrets.CORE_API_KEY }}
        run: |
          set -euo pipefail
          bash scripts/build-image.sh release "$(git rev-parse '${{ inputs.golden }}^{commit}')" gate-ref
          bash scripts/build-image.sh release "$(git rev-parse '${{ inputs.candidate }}^{commit}')" gate-cand
      - name: Live A/B (GATE-x.6; compose profile live)
        env:
          API_KEY: ${{ secrets.CORE_API_KEY }}
        run: npm run corpus -- --live --corpus '${{ inputs.corpus }}' --golden gate-ref --candidate gate-cand --limit 2000
