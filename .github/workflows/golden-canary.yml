# Golden canary (42 §10; created at 2.5): the e2e tiers on the chain-head reference against the committed
# baselines, nightly and on dispatch. A red run with the reference unchanged is environment drift (runner, browser,
# fonts, base image: 40 §9), never a reason to edit a baseline. Head checks of a deployable step need a success
# younger than 48 h (01 §4 step 3, TCD-31). Written at 2.5, not live until the owner enables it (2.6).
name: Golden canary

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: the chain-head reference (the golden tag until a D15 link exists, 42 §9)
        required: false
        default: upgrade-golden

permissions:
  contents: read

concurrency:
  group: golden-canary
  cancel-in-progress: false

env:
  ARTIFACT_DIR: ${{ github.workspace }}/../artifacts
  NEXT_TELEMETRY_DISABLED: '1'
  E2E_MODE: docker
  P2_DOCKER_MODE: enabled

jobs:
  canary:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@oacore'
      - run: npm ci --include=dev --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm ci --no-audit --no-fund
        working-directory: e2e
      - name: Baselines intact (42 §7)
        run: sha256sum -c test/baseline/SHA256SUMS >/dev/null
      - name: Parity images of the reference (default and harness variants)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          REF="$(git rev-parse '${{ inputs.ref || 'upgrade-golden' }}^{commit}')"
          echo "REF=$REF" >> "$GITHUB_ENV"
          node scripts/build-parity.mjs --mode docker --ref "$REF"
          node scripts/build-parity.mjs --mode docker --ref "$REF" --variant harness
      - name: Tiers G-I on the reference vs the committed baselines (retries 0)
        run: |
          set -uo pipefail
          rc=0
          npm run e2e:up -- --run canary --ref "$REF"
          npm run e2e -- --run canary --project chromium --project wire || rc=1
          npm run e2e -- --run canary --project visual -g 'T-801' || rc=1
          npm run e2e:down -- --run canary
          npm run e2e:up -- --run canary-du --ref "$REF" --variant harness
          npm run e2e -- --run canary-du --project visual -g 'T-802' || rc=1
          npm run e2e:down -- --run canary-du
          exit $rc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: golden-canary
          path: ${{ env.ARTIFACT_DIR }}/runs
          retention-days: 14
