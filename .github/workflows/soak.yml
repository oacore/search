# Pre-merge runtime check C6-CI (55 C6, T-902; created at 2.5, replaces the stage soak, OD-47). Dispatch at 01 §4
# step 3a of every deployable step from W0, at the 2.8 calibration and at the gate C6-CI runs. Parity images of the
# reference (the previous DONE step's merge commit), the candidate and the golden image at prod limits
# (mem_limit 768m, the prod CPU limit) in the compose topology replay the C4 corpus through the SSR stub at 10 rps
# in alternating 30-minute blocks (90 min per arm); rows 1-7 of 55 C6-CI. A breach re-runs once on a fresh runner;
# a second breach stops (01 §8). Written at 2.5, not live: tolerances are calibrated at 2.8 (3 runs, golden in all
# three arms).
name: Soak

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: the candidate commit (the step head)
        required: true
      reference:
        description: the previous DONE step's merge commit
        required: true
      golden:
        description: the golden reference
        required: false
        default: upgrade-golden
      corpus:
        description: the committed corpus under test/corpus/
        required: false
        default: c4
      rps:
        required: false
        default: '10'
      block_min:
        required: false
        default: '30'

permissions:
  contents: read

concurrency:
  group: soak
  cancel-in-progress: false

env:
  ARTIFACT_DIR: ${{ github.workspace }}/../artifacts
  NEXT_TELEMETRY_DISABLED: '1'
  E2E_MODE: docker
  P2_DOCKER_MODE: enabled

jobs:
  soak:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@oacore'
      - run: npm ci --include=dev --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Parity images of the three arms
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for r in '${{ inputs.reference }}' '${{ inputs.candidate }}' '${{ inputs.golden }}'; do
            node scripts/build-parity.mjs --mode docker --ref "$(git rev-parse "$r^{commit}")"
          done
      - name: C6-CI rows 1-7 (compose app at prod limits; e2e/compose.yml mem_limit 768m)
        run: |
          npm run soak -- --corpus '${{ inputs.corpus }}' \
            --reference "$(git rev-parse '${{ inputs.reference }}^{commit}')" \
            --candidate "$(git rev-parse '${{ inputs.candidate }}^{commit}')" \
            --golden "$(git rev-parse '${{ inputs.golden }}^{commit}')" \
            --rps '${{ inputs.rps }}' --block-min '${{ inputs.block_min }}' --blocks 3 --id "soak-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak
          path: ${{ env.ARTIFACT_DIR }}/soak
          retention-days: 90
